<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting to Ticketing Tool</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/?p=/one/two&a=b&c=d#qwe
      // Remember to replace the starting url in this script with your own URL.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/ticketing-tool/?p=' + 
        l.pathname + l.search + l.hash
      );
    </script>
  </head>
  <body>
    <div>
      <h1>Redirecting...</h1>
      <p>If you are not redirected automatically, please <a href="/ticketing-tool/">click here</a>.</p>
    </div>
  </body>
</html>
